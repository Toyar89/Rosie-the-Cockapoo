<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Incoming Video Call from Rosie</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section id="incomingScreen" class="screen incoming active">
      <img class="bg-photo" src="rosie-photo.png" alt="" />

      <div class="top-text">Incoming video call...</div>

      <div class="caller-card">
        <img class="caller-photo" src="rosie-photo.png" alt="Rosie" />
        <h1>Rosie</h1>
        <p id="recipientLine">Special message</p>
      </div>

      <div class="button-row">
        <button id="declineBtn" class="round-btn decline" aria-label="Decline call">
          <span>✕</span>
          <small>Decline</small>
        </button>

        <button id="answerBtn" class="round-btn answer" aria-label="Answer call">
          <span>✓</span>
          <small>Answer</small>
        </button>
      </div>

      <p class="tiny-note">Tap answer to hear from Rosie 🐾</p>
    </section>

    <section id="videoScreen" class="screen video-screen">
      <video id="rosieVideo" playsinline preload="auto">
        <source src="rosie-message.mp4" type="video/mp4" />
        Your browser does not support this video.
      </video>

      <div class="video-overlay top">
        <span>Rosie</span>
        <span id="timer">00:00</span>
      </div>

      <button id="endBtn" class="end-call" aria-label="End call">End Call</button>
    </section>

    <section id="endedScreen" class="screen ended">
      <img class="bg-photo" src="rosie-photo.png" alt="" />

      <div class="ended-card">
        <img class="caller-photo small" src="rosie-photo.png" alt="Rosie" />
        <h1>Call Ended</h1>
        <p>Rosie has finished her message and returned to important dog business.</p>

        <button id="replayBtn" class="wide-btn">Replay Message</button>
        <button id="resetBtn" class="ghost-btn">Back to Incoming Call</button>
      </div>

      <footer>Made with paws for Rosie & Kev</footer>
    </section>
  </main>

  <div class="desktop-warning">
    <div>
      <h1>Open this on a smartphone</h1>
      <p>This Rosie call page is designed for portrait phone screens.</p>
    </div>
  </div>

  <audio id="ringtone" src="ringtone-ios.mp3" preload="auto" loop></audio>

  <script src="script.js"></script>
</body>
</html>
